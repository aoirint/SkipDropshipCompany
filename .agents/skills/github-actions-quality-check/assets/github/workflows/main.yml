name: Main

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # Re-run the required source checks on the exact integrated commit.
  check:
    name: Check
    runs-on: ubuntu-slim

    steps:
      - name: Check out integrated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run shared source gate
        uses: ./.github/actions/check-repository-source
