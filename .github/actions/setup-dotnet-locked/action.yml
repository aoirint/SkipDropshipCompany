name: Set up locked .NET environment
description: Install the reviewed SDK and restore the committed NuGet graph.

outputs:
  build-state-owned:
    description: Whether this action established ownership of generated .NET build state.
    value: ${{ steps.ownership.outputs.build-state-owned }}

runs:
  using: composite
  steps:
    - name: Reserve .NET build state
      id: ownership
      shell: bash
      run: |
        test ! -e SkipDropshipCompany/bin
        test ! -e SkipDropshipCompany/obj
        echo 'build-state-owned=true' >>"$GITHUB_OUTPUT"

    - name: Set up .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json
        cache: true
        cache-dependency-path: SkipDropshipCompany/packages.lock.json

    - name: Restore NuGet packages
      shell: bash
      run: dotnet restore --locked-mode

    - name: Verify selected SDK
      shell: bash
      run: dotnet --version
